site_name: Authmoderne
site_description: Streamlined authentication for modern Python applications.

repo_url: https://github.com/frankie567/authmoderne
repo_name: frankie567/authmoderne

theme:
    name: material
    icon:
        logo: material/train-variant
    palette:
        # Palette toggle for automatic mode
        - media: "(prefers-color-scheme)"
          toggle:
              icon: material/brightness-auto
              name: Switch to light mode

        # Palette toggle for light mode
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: custom
          accent: custom
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode

        # Palette toggle for dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: custom
          accent: custom
          toggle:
              icon: material/brightness-4
              name: Switch to light mode
    features:
        - content.code.copy

extra_css:
    - stylesheets/extra.css

markdown_extensions:
    - toc:
          permalink: true
    - pymdownx.highlight:
          anchor_linenums: true
    - pymdownx.tasklist:
          custom_checkbox: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences
    - attr_list
    - md_in_html
    - admonition
    - pymdownx.details
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
    - search
    - mkdocstrings:
          handlers:
              python:
                  inventories:
                      - https://docs.python.org/3.13/objects.inv
                  options:
                      docstring_style: google

watch:
    - docs
    - authmoderne

nav:
    - Home: index.md
    - Reference:
          - authmoderne: reference/authmoderne.md
